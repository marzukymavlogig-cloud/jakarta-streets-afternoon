<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAKARTA — Streets of the Afternoon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud button { pointer-events: auto; cursor: pointer; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #hud-cash { font-size: 30px; font-weight: 800; color: #7dff9a;
    text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-stars { font-size: 26px; letter-spacing: 4px; color: #ffd700;
    text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-objective { margin-top: 8px; max-width: 420px; font-size: 15px; font-weight: 600;
    background: rgba(0,0,0,.55); padding: 7px 10px; border-radius: 6px; border-left: 4px solid #ffd700; }
  #hud-mission-bar { margin-top: 6px; width: 300px; height: 16px; background: rgba(0,0,0,.6);
    border-radius: 8px; overflow: hidden; position: relative; }
  #hud-mission-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffaa22, #ffd700); }
  #hud-mission-pct { position: absolute; right: 6px; top: 0; font-size: 12px; line-height: 16px; font-weight: 700; }
  #hud-timer { margin-top: 4px; font-size: 14px; font-weight: 700; color: #ffd700; text-shadow: 0 1px 4px #000; }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  #hud-minimap { border-radius: 50%; border: 3px solid rgba(255,255,255,.7);
    box-shadow: 0 2px 10px rgba(0,0,0,.6); background: rgba(20,26,34,.85); }
  #hud-health-wrap { margin-top: 6px; width: 180px; height: 14px; background: rgba(0,0,0,.6);
    border-radius: 7px; overflow: hidden; position: relative; margin-left: auto; }
  #hud-health-fill { height: 100%; width: 100%; background: #37c978; }
  #hud-health-text { position: absolute; right: 6px; top: 0; font-size: 11px; line-height: 14px; font-weight: 700; }
  #hud-bottom-left { position: absolute; left: 16px; bottom: 16px; }
  #hud-radio { font-size: 15px; font-weight: 700; color: #ffe9b0; text-shadow: 0 1px 4px #000; }
  #hud-dj { font-size: 13px; font-style: italic; color: #ddd; text-shadow: 0 1px 4px #000; max-width: 420px; }
  #hud-weapon { margin-top: 6px; font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 1px 4px #000; }
  #hud-slots { margin-top: 4px; display: flex; gap: 6px; }
  #hud-slots .slot { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 4px;
    background: rgba(0,0,0,.55); color: #777; border: 1px solid #555; }
  #hud-slots .slot.owned { color: #ddd; border-color: #999; }
  #hud-slots .slot.active { color: #111; background: #ffd700; border-color: #ffd700; }
  #hud-bottom-right { position: absolute; right: 16px; bottom: 16px; text-align: right; }
  #hud-speed { font-size: 40px; font-weight: 800; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  #hud-speed-unit { font-size: 12px; color: #ddd; }
  #hud-clock { font-size: 20px; font-weight: 700; text-shadow: 0 1px 4px #000; }
  #hud-weather { font-size: 14px; text-shadow: 0 1px 4px #000; }
  #hud-dialogue { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; max-width: 640px;
    background: rgba(0,0,0,.72); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,215,0,.5); }
  #hud-portrait { width: 44px; height: 44px; border-radius: 50%; background: #ffd700; color: #111;
    font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; }
  #hud-dialogue-speaker { font-size: 12px; font-weight: 800; color: #ffd700; letter-spacing: 1px; }
  #hud-dialogue-text { font-size: 16px; }
  #hud-toasts { position: absolute; left: 50%; top: 90px; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .toast { background: rgba(0,0,0,.75); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; }
  .toast.good { border: 1px solid #37c978; color: #a9f5c6; }
  .toast.warn { border: 1px solid #ff4444; color: #ffb3b3; }
  #hud-hint { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,.65); text-shadow: 0 1px 3px #000; white-space: nowrap; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(10,8,6,.55); pointer-events: auto; text-align: center; padding: 20px; }
  .screen h1 { font-size: 64px; margin: 0; letter-spacing: 6px; color: #ffd700;
    text-shadow: 0 4px 24px rgba(255,150,40,.6); }
  .screen h2 { font-size: 22px; margin: 4px 0 18px; font-weight: 400; letter-spacing: 3px; color: #ffe9b0; }
  .screen p { max-width: 560px; font-size: 16px; line-height: 1.5; }
  .screen .controls { font-size: 13px; color: #ccc; }
  .screen .fine { margin-top: 22px; font-size: 12px; color: #999; }
  .screen button { margin: 6px; padding: 12px 28px; font-size: 17px; font-weight: 800;
    background: #ffd700; color: #111; border: none; border-radius: 8px; }
  .screen button:hover { background: #ffe066; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="JAKARTA Streets of the Afternoon: open-world crime game in Jakarta"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
